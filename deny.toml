# cargo-deny configuration (docs/02-architecture.md §2.6 "Supply chain"). Verified with cargo-deny 0.20.2.
# Run: cargo deny check   (CI runs it on windows-latest; see .github/workflows/ci.yml)

[graph]
targets = ["x86_64-pc-windows-msvc"]
all-features = false
# The M0 spikes are standalone packages (excluded from the workspace) and are not checked here.

[advisories]
# Every RustSec advisory (vulnerability, unmaintained, unsound, notice) fails the check unless it
# is listed below with a reason and a review date.
unmaintained = "all"
yanked = "deny"
ignore = [
  # { id = "RUSTSEC-YYYY-NNNN", reason = "why it does not apply; re-check by YYYY-MM-DD" },
  # Both arrive only through the pinned lancedb =0.40.0 (lance 13) and are "unmaintained" notices,
  # not vulnerabilities. Re-check on every lancedb bump (R24) and by the date given. (W2-H)
  { id = "RUSTSEC-2024-0436", reason = "paste: proc-macro, compile time only (lance-bitpacking/lance-encoding); no runtime code; re-check by 2027-01-18" },
  { id = "RUSTSEC-2024-0449", reason = "unsafe-libyaml via serde_yaml_ng <- lindera <- lance-tokenizer: parses lindera's own dictionary config, never user content; we index with tantivy, not lindera; re-check by 2027-01-18" },
]

[licenses]
# Permissive licences compatible with shipping an Apache-2.0 closed or open binary.
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "MIT",
  "MIT-0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "CC0-1.0",
  "BSL-1.0",
  "Unlicense",
  "CDLA-Permissive-2.0",   # webpki-roots / Mozilla CA data (via rustls, arrives with reqwest)
  "MPL-2.0",               # file-level copyleft; allowed, no source changes are vendored
]
confidence-threshold = 0.9
private = { ignore = true } # our own crates are publish = false

[bans]
# Duplicate versions are a warning; spike test 9 (docs/04-roadmap.md) turns duplicate *majors*
# of tower-http, reqwest, hyper and arrow into a hard M0 decision.
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true  # internal path dependencies
highlight = "all"
deny = [
  # TLS: rustls only (no OpenSSL / native-tls runtime prerequisite, P1.1).
  { crate = "openssl-sys", reason = "no OpenSSL runtime on user machines" },
  { crate = "native-tls", reason = "rustls only" },
  # Amendment 3.13: ring is the only rustls crypto provider (two providers = runtime panic unless
  # one is installed first; aws-lc also needs cmake/NASM to build). CO-1.
  { crate = "aws-lc-rs", reason = "ring is the only rustls provider (3.13)" },
  { crate = "aws-lc-sys", reason = "ring is the only rustls provider (3.13)" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
