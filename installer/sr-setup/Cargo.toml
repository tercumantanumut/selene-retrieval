# sr-setup: install/uninstall helper run by the NSIS hooks (crates/app/nsis/hooks.nsh) and never by a
# user. It is its own workspace on purpose (M2-I owns installer/ only, not the root Cargo.toml); it
# reuses the root workspace crates by path, so task naming, task XML, the install-dir ACE and the
# AppContainer profile name have exactly one implementation. Build: `cargo xtask package`.
# Static VC runtime (hybrid CRT, Amendment 4.1): the helper runs from the installer's temp dir.
[package]
name = "sr-setup"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "Apache-2.0"
publish = false

[[bin]]
name = "sr-setup"
path = "src/main.rs"

[dependencies]
sr-client = { path = "../../crates/client" }
sr-extract-client = { path = "../../crates/extract/client" }
sr-common = { path = "../../crates/common" }
serde_json = "1.0.154"         # the app's Connect writer, compiled verbatim (src/clients.rs)
tokio = { version = "1.53.3", features = ["rt", "time"] }
# COM for the Task Scheduler folder only (src/taskfolder.rs); same version as the root lockfile.
windows = { version = "0.62.2", features = [
  "Win32_System_Com", "Win32_System_Ole", "Win32_System_TaskScheduler", "Win32_System_Variant",
  "Win32_UI_Shell",
] }
windows-sys = { version = "0.61.2", features = [
  "Win32_Foundation", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Threading",
  "Win32_Security_Credentials",   # src/creds.rs: remove our AI provider keys on uninstall (M3)
  "Win32_System_Registry",        # src/autostart.rs: autostart values on uninstall (M5-I)
] }

[dev-dependencies]
tempfile = "3.27.0"

[workspace]

[workspace.lints.rust]
unsafe_code = "deny"           # reviewed modules only: src/proc.rs (process scan), src/taskfolder.rs (COM), src/clients.rs (known folder), src/creds.rs (Credential Manager), src/autostart.rs (registry value delete)
[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "warn"
dbg_macro = "deny"

[lints]
workspace = true

# Same release settings as the root workspace (the dist profile is passed by `cargo xtask package`).
[profile.release]
lto = "thin"
codegen-units = 1
debug = "line-tables-only"
panic = "unwind"
