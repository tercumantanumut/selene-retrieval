[package]
name = "native-stack-spike"
version = "0.0.0"
edition = "2024"
publish = false
rust-version = "1.95"

# Standalone: keep this spike out of any parent workspace.
[workspace]

[features]
default = []
# Pulls hf-hub so fastembed's built-in EmbeddingModel::BGESmallENV15 can be loaded (test 11 only).
builtin = ["fastembed/hf-hub-rustls-tls"]

[dependencies]
lancedb = { version = "=0.40.0", default-features = false }
arrow-array = "58"
arrow-schema = "58"
tantivy = "=0.26.2"
fastembed = { version = "=7.1.1", default-features = false, features = ["ort-download-binaries-rustls-tls"] }
rusqlite = { version = "=0.40.2", features = ["bundled"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
futures = "0.3"
anyhow = "1"
serde_json = "1"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_LibraryLoader",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
] }

[profile.release]
debug = false
strip = "symbols"
codegen-units = 16
lto = false

# lancedb 0.38-0.40 do not compile without the `remote` feature (lancedb#4142; fixed in 0.41.0 by #4233).
# Uses the workspace's patched copy (two-arm cfg patch in src/job.rs only; see patches/README.md).
[patch.crates-io]
lancedb = { path = "../../patches/lancedb-0.40.0" }

# M0-B size measurement profile (test 10): what a shipping build would use.
[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1
