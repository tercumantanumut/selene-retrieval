[package]
name = "sr-daemon-spike"
version = "0.0.1"
edition = "2024"
publish = false

# Standalone: not part of the Selene repo or any outer workspace.
[workspace]

[[bin]]
name = "sr-daemon"
path = "src/main.rs"

[[bin]]
name = "sr-harness"
path = "src/bin/harness.rs"

[dependencies]
rmcp = { version = "=3.5.1", default-features = false, features = ["server", "macros", "transport-async-rw"] }
tokio = { version = "1.53", features = ["rt-multi-thread", "net", "io-util", "time", "macros", "sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_Storage_Packaging_Appx",
    "Win32_System_IO",
    "Win32_System_Threading",
    "Win32_System_Com",
    "Win32_System_Pipes",
    "Win32_System_JobObjects",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_UI_Shell",
] }

[profile.release]
opt-level = 3
codegen-units = 16
panic = "unwind"
strip = "symbols"
