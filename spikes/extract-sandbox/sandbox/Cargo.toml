[package]
name = "m0c-sandbox"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[[bin]]
name = "sr-extract"
path = "src/bin/sr-extract.rs"

[[bin]]
name = "harness"
path = "src/bin/harness.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
pdfium-render = { version = "=0.9.4", default-features = false, features = ["pdfium_7881", "thread_safe"] }
zip = { version = "=9.0.5", default-features = false, features = ["deflate"] }
quick-xml = "=0.42.0"
html2text = "=0.17.3"
pulldown-cmark = { version = "=0.13.4", default-features = false }
windows-sys = { version = "=0.61.2", features = [
  "Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Security",
  "Win32_System_Pipes", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_ProcessStatus",
  "Win32_Security_Isolation", "Win32_System_LibraryLoader", "Win32_Security_Authorization",
  "Win32_System_Memory", "Win32_System_SystemServices", "Win32_System_Diagnostics_Debug", "Win32_System_Kernel",
] }

[profile.release]
panic = "unwind"
