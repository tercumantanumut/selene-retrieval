[package]
name = "sr-extract-client"
description = "Supervisor for sandboxed sr-extract workers: pool, AppContainer/low-IL spawn, Job Object limits, timeouts"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# Deliberately free of parser dependencies (no pdfium, zip, xml): sr-core links this, never
# sr-extract itself (docs/02 §2.1 "pdfium only lives in sr-extract").
[dependencies]
sr-common   = { workspace = true }
serde_json  = { workspace = true }
tokio       = { workspace = true }
tracing     = { workspace = true }
windows-sys = { workspace = true, features = [
  "Win32_Security_Isolation", "Win32_System_IO", "Win32_System_SystemServices",
  "Win32_System_Memory",
] }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
