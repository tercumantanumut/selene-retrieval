[package]
name = "sr-client"
description = "Pipe client (attach, handshake, app-RPC, event resume) and the sr-launch logic; no engine deps"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
blake3 = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sr-common = { workspace = true }
tokio = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_System_IO", "Win32_System_SystemInformation", "Win32_System_Com", "Win32_UI_Shell", "Win32_Networking_WinSock"] }

# macOS port: the Unix socket transport (`sr_client::unix`).
[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[lints]
workspace = true
