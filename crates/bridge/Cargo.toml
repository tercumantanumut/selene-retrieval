[package]
name = "sr-bridge"
description = "sr-bridge (stdio <-> pipe byte proxy) and sr-launch (verified-breakaway / task launcher); no engine deps"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# Both shipped exes live in this package because they share its (tiny) dependency graph:
# sr-common + sr-client + tokio + windows-sys. Never add an engine crate here (CI: cargo tree).
[[bin]]
name = "sr-bridge"
path = "src/main.rs"

[[bin]]
name = "sr-launch"
path = "src/launch.rs"

# Test-only stub daemon: compiles crates/engine/src/pipe.rs verbatim over a fake service.
# Never packaged (xtask copies sr-bridge.exe and sr-launch.exe only).
[[bin]]
name = "sr-test-daemon"
path = "src/test_daemon.rs"
test = false

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
sr-common = { workspace = true }
sr-client = { workspace = true }
tokio = { workspace = true, features = ["io-std"] }

[dev-dependencies]
windows-sys = { workspace = true, features = ["Win32_System_Diagnostics_ToolHelp", "Win32_System_SystemServices"] }

[lints]
workspace = true
