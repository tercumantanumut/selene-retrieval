[package]
name = "sr-app"
description = "Selene Retrieval desktop app (Tauri 2): wizard, tray, Connect writer, updater. A pipe client only."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
default-run = "sr-app"

[[bin]]
name = "sr-app"
path = "src/main.rs"

[features]
# Set by `tauri build` (and by hand for a local "real" build): embed ui/dist instead of the dev server.
custom-protocol = ["tauri/custom-protocol"]

[dependencies]
sr-common = { workspace = true }
sr-client = { workspace = true }

tauri = { workspace = true, features = ["image-png"] }
tauri-plugin-single-instance = { workspace = true }
tauri-plugin-autostart       = { workspace = true }
tauri-plugin-updater         = { workspace = true }
tauri-plugin-dialog          = { workspace = true }
tauri-plugin-notification    = { workspace = true }
specta            = { workspace = true }
tauri-specta      = { workspace = true }
specta-typescript = { workspace = true }

notify     = { workspace = true }
serde      = { workspace = true }
serde_json = { workspace = true }
tokio      = { workspace = true }
tracing    = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }

[lints]
workspace = true
